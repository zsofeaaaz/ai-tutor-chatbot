
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Miss Sofea AI Tutor</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #bp-embedded-webchat {
      position: relative;
      width: 100%;
      height: 600px;
    }

    .bpFab {
      display: none !important;
    }

    .bpWebchat {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
    }
  </style>

  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>

  <script>
    window.botpress.on('webchat:initialized', () => {
      window.botpress.open();
    });
  </script>

  <script src="https://files.bpcontent.cloud/2026/11/13/05/20261113055447-08S4EL9U.js" defer></script>

</head>

<body>
  <div id="bp-embedded-webchat"></div>
</body>
</html>
